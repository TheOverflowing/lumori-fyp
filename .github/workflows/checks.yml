name: Repository checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - name: Compile application and scripts
        run: python -m compileall -q app scripts
      - name: API, ownership and provider fixture tests
        run: python -m pytest -q tests/test_auth_core.py tests/test_account_isolation.py tests/test_providers.py tests/test_workflow.py
      - name: Frontend tests
        run: node --test tests/frontend_*.test.mjs
