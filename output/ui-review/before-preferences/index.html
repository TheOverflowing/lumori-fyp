<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#eff1ee">
  <title>知序 — 教学创作空间</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/material.css">
  <script type="module" src="/static/app.js"></script>
</head>
<body>
  <a class="skip" href="#main">跳转到内容</a>
  <div class="app-shell">
    <aside class="sidebar" aria-label="工作空间">
      <a class="identity" href="#home"><img src="/static/icons/book-open.svg" alt=""><span>知序</span></a>
      <div class="course-switcher"><label class="sr-only" for="course-select">当前课程</label><select id="course-select"><option value="">正在载入…</option></select><button class="plain icon-button" data-action="new-course" aria-label="新建课程" title="新建课程"><img src="/static/icons/plus.svg" alt=""></button></div>
      
      <nav id="navigation" aria-label="主导航">
        <a href="#home" data-page="home" data-short-label="概览" aria-label="课程概览"><img src="/static/icons/panels-top-left.svg" alt="">课程概览</a>
        <a href="#documents" data-page="documents" data-short-label="资料" aria-label="课程资料"><img src="/static/icons/files.svg" alt="">课程资料</a>
        <a href="#generate" data-page="generate" data-short-label="创作" aria-label="创作学习材料"><img src="/static/icons/wand-sparkles.svg" alt="">创作学习材料</a>
        <a href="#contents" data-page="contents" data-short-label="内容" aria-label="内容与审核"><img src="/static/icons/book-open.svg" alt="">内容与审核</a>
        <a href="#jobs" data-page="jobs" data-short-label="任务" aria-label="任务记录"><img src="/static/icons/clock-3.svg" alt="">任务记录</a>
      </nav>
      <div class="sidebar-bottom"><button class="settings" data-action="settings" aria-label="模型连接" title="模型连接"><img src="/static/icons/settings-2.svg" alt="">模型连接</button></div>
    </aside>
    <div class="app-main">
      <header class="toolbar"><div class="breadcrumb"><span id="route-label">课程概览</span></div><div id="toolbar-actions"></div></header>
      <main id="main" tabindex="-1"><div id="page" aria-live="off"></div></main>
    </div>
  </div>
  <div id="notice" class="notice" hidden><span id="notice-text" role="status" aria-live="polite"></span><button class="notice-close" aria-label="关闭提示">关闭</button></div>
  <dialog id="modal" aria-labelledby="modal-title"><div id="modal-content"></div></dialog>
</body>
</html>
